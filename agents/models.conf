# Default models for the opsx-run sub-agents, per agent CLI.
#
# Format: one `<cli>.<agent> = <model>` per line. Blank lines and lines starting
# with `#` are ignored.
#   <cli>    claude (Claude Code), agent (Cursor CLI), opencode (OpenCode)
#   <agent>  applier, eval, reviewer, security, qa
#   <model>  a model id the CLI accepts, or `inherit` (use the window's model)
#
# Override single keys in ${XDG_CONFIG_HOME:-~/.config}/tmux-opsx/models.conf
# (same format; keys it does not set keep the values below), then re-run
# ./install.sh so the installed agent files pick up the change.
#
# Codex and Gemini windows do the work themselves without sub-agents, so they
# have no entries here.

claude.applier  = opus
claude.eval     = sonnet
claude.reviewer = opus
claude.security = opus
claude.qa       = sonnet

agent.applier  = inherit
agent.eval     = inherit
agent.reviewer = inherit
agent.security = inherit
agent.qa       = inherit

opencode.applier  = inherit
opencode.eval     = inherit
opencode.reviewer = inherit
opencode.security = inherit
opencode.qa       = inherit
